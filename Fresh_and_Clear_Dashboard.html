<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh and Clear Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }
        
        .header h1 {
            color: #2E5894;
            font-size: 36px;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 18px;
        }
        
        .dashboard {
            width: 100%;
            max-width: 600px;
            display: grid;
            gap: 20px;
        }
        
        .button {
            background: white;
            border: none;
            border-radius: 15px;
            padding: 30px;
            font-size: 22px;
            font-weight: bold;
            color: #2E5894;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .button:active {
            transform: translateY(-2px);
        }
        
        .icon {
            font-size: 36px;
            min-width: 50px;
            text-align: center;
        }
        
        .button-text {
            flex: 1;
        }
        
        .help-button {
            background: #4A90E2;
            color: white;
        }
        
        .comfort-button {
            background: #50C878;
            color: white;
        }
        
        .memory-button {
            background: #FFB347;
            color: white;
        }
        
        .question-button {
            background: #9B59B6;
            color: white;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        .modal-content h2 {
            color: #2E5894;
            font-size: 28px;
            margin-bottom: 20px;
        }
        
        .modal-content p {
            color: #333;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .prompt-box {
            background: #f4f7ff;
            border: 2px solid #4A90E2;
            border-radius: 12px;
            padding: 18px;
            font-size: 18px;
            color: #222;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: left;
            user-select: all;
            cursor: text;
            white-space: pre-wrap;
        }

        .prompt-label {
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            text-align: left;
        }

        .copy-button {
            background: #4A90E2;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 12px;
        }

        .copy-button:active {
            background: #357ABD;
        }

        .copy-button.copied {
            background: #50C878;
        }

        .close-button {
            background: transparent;
            color: #888;
            border: 2px solid #ddd;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .close-button:active {
            background: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌟 Fresh and Clear</h1>
        <p>Your gentle AI helper</p>
    </div>
    
    <div class="dashboard">
        <button class="button help-button" onclick="showMessage('help')">
            <span class="icon">💡</span>
            <span class="button-text">Help me find a word</span>
        </button>
        
        <button class="button comfort-button" onclick="showMessage('confused')">
            <span class="icon">🤗</span>
            <span class="button-text">I'm feeling confused</span>
        </button>
        
        <button class="button memory-button" onclick="showMessage('story')">
            <span class="icon">📖</span>
            <span class="button-text">Tell me a story</span>
        </button>
        
        <button class="button question-button" onclick="showMessage('today')">
            <span class="icon">📅</span>
            <span class="button-text">What day is today?</span>
        </button>
        
        <button class="button help-button" onclick="showMessage('time')">
            <span class="icon">⏰</span>
            <span class="button-text">What time is it?</span>
        </button>
        
        <button class="button comfort-button" onclick="showMessage('talk')">
            <span class="icon">💬</span>
            <span class="button-text">I want to talk</span>
        </button>
        
        <button class="button memory-button" onclick="showMessage('memory')">
            <span class="icon">🌸</span>
            <span class="button-text">Share a memory</span>
        </button>
        
        <button class="button question-button" onclick="window.open('https://claude.ai', '_blank')">
            <span class="icon">🤖</span>
            <span class="button-text">Open Claude Chat</span>
        </button>
    </div>
    
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Message</h2>
            <p id="modal-text" style="display:none"></p>
            <p id="prompt-label" class="prompt-label" style="display:none">Paste this into Gemma:</p>
            <div id="prompt-box" class="prompt-box" style="display:none"></div>
            <button id="copy-button" class="copy-button" style="display:none" onclick="copyPrompt()">Copy Prompt</button>
            <button class="close-button" onclick="closeModal()">Close</button>
        </div>
    </div>
    
    <script>
        const messages = {
            help: {
                title: "💡 Help me find a word",
                prompt: "I'm trying to think of a word but I can't remember it. Please help me find it by asking me one gentle question at a time — like what it means, what it starts with, or how it feels. Be patient and kind."
            },
            confused: {
                title: "🤗 I'm feeling confused",
                prompt: "I'm feeling a bit confused and overwhelmed right now. Please talk to me gently. Keep your words simple, short, and reassuring. Remind me that I'm safe and that it's okay to take things slowly."
            },
            story: {
                title: "📖 Tell me a story",
                prompt: "Please tell me a warm, gentle, soothing short story. Something peaceful — maybe about nature, a garden, animals, or a quiet village. Keep the words simple and the mood calm and happy."
            },
            today: {
                title: "📅 Today's Date",
                direct: "Today is " + new Date().toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
            },
            time: {
                title: "⏰ Current Time",
                direct: "Right now it's " + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })
            },
            talk: {
                title: "💬 I want to talk",
                prompt: "I'd like to have a friendly conversation. Please start by asking me one simple, warm question about my day or something I enjoy. Be gentle, friendly, and easy to talk to."
            },
            memory: {
                title: "🌸 Share a memory",
                prompt: "I'd like to talk about a happy memory. Please ask me one gentle question to help me start — like a favourite place I've been, someone I loved, or a time that made me smile."
            }
        };

        function showMessage(type) {
            const msg = messages[type];
            const modal = document.getElementById('modal');
            const title = document.getElementById('modal-title');
            const text = document.getElementById('modal-text');
            const promptLabel = document.getElementById('prompt-label');
            const promptBox = document.getElementById('prompt-box');
            const copyBtn = document.getElementById('copy-button');

            title.textContent = msg.title;

            if (msg.direct) {
                text.textContent = msg.direct;
                text.style.display = 'block';
                promptLabel.style.display = 'none';
                promptBox.style.display = 'none';
                copyBtn.style.display = 'none';
            } else {
                text.style.display = 'none';
                promptLabel.style.display = 'block';
                promptBox.textContent = msg.prompt;
                promptBox.style.display = 'block';
                copyBtn.textContent = 'Copy Prompt';
                copyBtn.className = 'copy-button';
                copyBtn.style.display = 'block';
            }

            modal.style.display = 'flex';
        }

        function copyPrompt() {
            const text = document.getElementById('prompt-box').textContent;
            const btn = document.getElementById('copy-button');
            navigator.clipboard.writeText(text).then(() => {
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = 'Copy Prompt';
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
    </script>
</body>
</html>
